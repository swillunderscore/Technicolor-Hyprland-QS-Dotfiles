exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/libexec/xdg-desktop-portal-hyprland &

# HYPRLAND CONFIG - CachyOS / AMD RX 9060 XT

###################

### MY PROGRAMS

###################

$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun

#################

### AUTOSTART

#################

exec-once = quickshell
exec-once = mako
exec-once = nwg-look -a
exec-once = dex -a -s ~/.config/autostart
exec-once = awww-daemon
exec-once = sleep 1 && ~/.config/hypr/wallpaper-cycle.sh random
exec-once = bash -c 'while true; do sleep 3600; ~/.config/hypr/wallpaper-cycle.sh random; done'
exec = wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.5
exec-once = ~/.config/hypr/carousel-init.sh
exec-once = ~/.config/hypr/workspace-watcher.sh
exec-once = ~/.config/hypr/minimize-watcher.sh
exec-once = ~/.config/hypr/notif-focus-watcher.sh

#############################

### ENVIRONMENT VARIABLES

#############################

env = XDG_SESSION_TYPE,wayland

###################

### PERMISSIONS

###################

#####################

### LOOK AND FEEL

#####################

general {
gaps_in = 4
gaps_out = 6
border_size = 2
col.active_border = rgba(ffffffcc)
col.inactive_border = rgba(404040aa)
resize_on_border = false
allow_tearing = false
layout = dwindle
}

render {
# Hand fullscreen apps straight to the display instead of routing every
# frame through the compositor. Off by default in Hyprland — without it a
# fullscreen game is always composited (+1 frame latency, pacing coupled
# to the compositor), which is why high fps still feels laggy.
direct_scanout = 1
}

decoration {
rounding = 10
rounding_power = 2
active_opacity = 1.0
inactive_opacity = 1.0
shadow {
enabled = true
range = 4
render_power = 3
color = rgba(1a1a1aee)
}
blur {
enabled = true
size = 3
passes = 1
vibrancy = 0.1696
}
}

animations {
enabled = yes, please :)
bezier = easeOutQuint,   0.23, 1,    0.32, 1
bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
bezier = linear,         0,    0,    1,    1
bezier = almostLinear,   0.5,  0.5,  0.75, 1
bezier = quick,          0.15, 0,    0.1,  1
bezier = slideOut,       0.25, 1,  0.3,  1
animation = global,        1,     10,    default
animation = border,        1,     5.39,  easeOutQuint
animation = windows,       1,     4.79,  easeOutQuint
animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
animation = windowsOut,    1,     1.49,  linear,       popin 87%
animation = fadeIn,        1,     1.73,  almostLinear
animation = fadeOut,       1,     1.46,  almostLinear
animation = fade,          1,     3.03,  quick
animation = layers,        1,     3.81,  easeOutQuint
animation = layersIn,      1,     4,     easeOutQuint, fade
animation = layersOut,     1,     1.5,   linear,       fade
animation = fadeLayersIn,  1,     1.79,  almostLinear
animation = fadeLayersOut, 1,     1.39,  almostLinear
animation = workspaces,    1,     5.82,  slideOut, slide
animation = workspacesIn,  1,     3.63,  slideOut, slide
animation = workspacesOut, 1,     5.82,  slideOut, slide
animation = zoomFactor,    1,     7,     quick
}

dwindle {
preserve_split = true
}

master {
new_status = master
}

misc {
force_default_wallpaper = 0
disable_hyprland_logo = true
vrr = 2
# Apps that try to grab focus (e.g. browser link click → terminal popups)
# can't yank you out of what you're doing
focus_on_activate = false
}

#############

### INPUT

#############

input {
kb_layout = us
# Click to focus only — never on hover. (No more accidentally typing into
# whatever window the cursor brushed past.)
follow_mouse = 0
mouse_refocus = false
# Floating windows shouldn't steal focus when hovered either
float_switch_override_focus = 0
sensitivity = 0
force_no_accel = true
touchpad {
natural_scroll = false
}
}


gesture = 3, horizontal, workspace

###################

### KEYBINDINGS

###################

$mainMod = SUPER

bind = $mainMod, W, exec, ~/.config/hypr/wallpaper-cycle.sh next
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, wlogout
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
# Toggle floating for the active window
bind = $mainMod, SPACE, togglefloating

# Screenshots
bind = $shiftMod, PRINT, exec, grim -g "$(slurp)" -t ppm - | satty --filename - --output-filename ~/Pictures/Screenshots/$(date '+%Y%m%d-%H%M%S').png --copy-command wl-copy
bind = $mainMod, PRINT, exec, grim - | satty --filename - --fullscreen --output-filename ~/Pictures/Screenshots/$(date '+%Y%m%d-%H%M%S').png --copy-command wl-copy

# Move focus

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = ALT, Tab, global, quickshell:alttab
bindr = ALT, Tab, exec, hyprctl dispatch global "quickshell:alttabrelease"

# Super + scroll-up brings up the alt-tab pie. (mouse_down keyword = physical
# scroll-up on this hardware.) Releasing Super activates the hovered window;
# Escape or clicking outside dismisses without activating.
bind = $mainMod, mouse_down, global, quickshell:alttab
bindr = , SUPER_L, exec, hyprctl dispatch global "quickshell:alttabrelease"

# macOS-style minimize: SUPER+scroll stashes the hovered window on the
# special:minimized workspace. Debounced inside minimize.sh.
# (mouse_up here = physical scroll-down on this hardware)
bind = $mainMod, mouse_up, exec, ~/.config/hypr/minimize.sh

# ==========================================================

# WORKSPACE NAVIGATION

# ==========================================================

bind = $mainMod, bracketleft, exec, ~/.config/hypr/workspace-move.sh left
bind = $mainMod, bracketright, exec, ~/.config/hypr/workspace-move.sh right
bind = $mainMod SHIFT, bracketleft, exec, ~/.config/hypr/workspace-move.sh left --move
bind = $mainMod SHIFT, bracketright, exec, ~/.config/hypr/workspace-move.sh right --move

# Mouse binds

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# ==========================================================

# AI BACKGROUND TASK KILL-SWITCH

# ==========================================================

bind = CTRL ALT $mainMod, A, exec, tmux kill-server

##############################

### WINDOWS AND WORKSPACES

##############################

windowrule = suppress_event maximize, match:class .*

# Float everything by default — no tiling
windowrule = float on, match:class .*

windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0
windowrule = float on, match:class ^(hyprland-run)$
windowrule = move 20 100%-120, match:class ^(hyprland-run)$

# GPU SCREEN RECORDER UI

windowrule = float on, match:class ^(com.dec05eba.gpu_screen_recorder)$
windowrule = no_anim on, match:class ^(com.dec05eba.gpu_screen_recorder)$
windowrule = no_blur on, match:class ^(com.dec05eba.gpu_screen_recorder)$
windowrule = no_shadow on, match:class ^(com.dec05eba.gpu_screen_recorder)$
windowrule = border_size 0, match:class ^(com.dec05eba.gpu_screen_recorder)$
windowrule = size 100% 100%, match:class ^(com.dec05eba.gpu_screen_recorder)$
windowrule = center on, match:class ^(com.dec05eba.gpu_screen_recorder)$

windowrule = float on, match:class ^(gsr-ui)$
windowrule = no_anim on, match:class ^(gsr-ui)$
windowrule = no_blur on, match:class ^(gsr-ui)$
windowrule = no_shadow on, match:class ^(gsr-ui)$
windowrule = border_size 0, match:class ^(gsr-ui)$
windowrule = size 100% 100%, match:class ^(gsr-ui)$
windowrule = center on, match:class ^(gsr-ui)$

source = ~/.config/hypr/monitors.conf

env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,Breeze

# Machine-specific / personal settings — git-ignored, kept off the public repo.
source = ~/.config/hypr/local.conf


