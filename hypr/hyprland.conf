exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/libexec/xdg-desktop-portal-hyprland &

# HYPRLAND CONFIG - CachyOS / AMD RX 9060 XT

###################

### MY PROGRAMS

###################

$terminal = kitty
# Settings → System → Default terminal overrides $terminal here (sourced after,
# so the picker's choice wins; absent = kitty).
source = ~/.config/hypr/terminal.conf
$fileManager = ~/.config/hypr/dolphin-tc.sh
$menu = wofi --show drun --conf ~/.config/hypr/wofi/config --style ~/.config/hypr/wofi/style.css

#################

### AUTOSTART

#################

exec-once = quickshell
exec-once = mako
exec-once = nwg-look -a
# NOTE: no `dex` here. This session is managed by UWSM, which already runs XDG
# autostart entries (~/.config/autostart AND /etc/xdg/autostart) via systemd's
# xdg-desktop-autostart.target. Adding `dex -a -s ~/.config/autostart` ran
# ~/.config/autostart a SECOND time → duplicate processes (e.g. two Sunshines).
# exec-once = dex -a -s ~/.config/autostart
exec-once = awww-daemon
exec-once = sleep 1 && ~/.config/hypr/wallpaper-cycle.sh random
exec-once = ~/.config/hypr/wallpaper-timer.sh
# exec-once, NOT exec: `exec =` re-runs on EVERY `hyprctl reload`, which is what
# kept snapping the volume back to 50% every time the config was reloaded.
# exec-once only sets it once at login. (Delete this line entirely if you don't
# even want the volume defaulting to 50% at startup.)
exec-once = wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.5
exec-once = ~/.config/hypr/carousel-init.sh
exec-once = ~/.config/hypr/workspace-watcher.sh
exec-once = ~/.config/hypr/minimize-watcher.sh
exec-once = ~/.config/hypr/notif-focus-watcher.sh
# Remembers floating window monitor/size/position per app, across reboots
# (writes the rules sourced in the WINDOWS section). Spawns windows at their
# saved spot rather than moving them after — no jump.
# (Confirmed NOT the cause of the monitor-power-cycle crash — that still
# happened with this disabled. Re-enabled. It now pauses recording while a
# monitor is off so an overnight power-off doesn't clobber saved positions.)
exec-once = ~/.config/hypr/window-geometry.py
# Bridges Telegram's Unity badge count (incl muted chats) to the bar. Needs the
# flatpak perm: flatpak override --user --talk-name=com.canonical.Unity.LauncherEntry org.telegram.desktop
exec-once = ~/.config/hypr/tg-badge-listener.py
# Regenerate the wofi font include from font.conf (Settings → System → Font)
exec-once = ~/.config/hypr/gen-wofi-font.sh
# Serves the live wallpaper palette (127.0.0.1:9573) to the Spotify
# technicolor-sync Spicetify extension — Spotify's web view can't read files.
exec-once = ~/.config/hypr/technicolor-color-server.py
# Load both plugins at startup. BOTH are vendored + built against the SYSTEM
# Hyprland headers (no hyprpm, no sudo) so a Hyprland update can't strand them in
# a root-owned /var/cache that needs a password to rebuild — each load.sh
# force-rebuilds itself when its .so is ABI-stale. Hypr-DarkWindow = Spotify/
# Brave/Dolphin chromakey (the `darkwindow:shade` rules below); hyprglass = live
# glass on the alt-tab pie. (Any hyprpm-loaded copies get unloaded by the scripts.)
exec-once = sh -c '"$HOME/.config/hypr/Hypr-DarkWindow/load.sh"; "$HOME/.config/hypr/hyprglass/load.sh"'
# plugins register their config AFTER the initial parse — one follow-up reload
# so the darkwindow custom shader (tckey) binds at boot without errors
exec-once = sleep 5 && hyprctl reload

# hyprglass: liquid glass WITHOUT the frosting — no blur, no tint, and the
# tone-mapping fully neutralized (its dark-theme DEFAULTS darken/desaturate:
# brightness .82, saturation .8, contrast .9, adaptive_dim .4 — that read as
# "tinting"). Keeps the lens: refraction/aberration/specular/dome.
plugin:hyprglass:blur_strength = 0.2
plugin:hyprglass:blur_iterations = 1
plugin:hyprglass:tint_color = 0x00000000
plugin:hyprglass:fresnel_strength = 0.3
plugin:hyprglass:specular_strength = 0.3
# more intense warp (user request): stronger edge bending + wider bezel +
# stronger spectral fringing and center dome
plugin:hyprglass:refraction_strength = 1
# 0 = no R/B colour fringe at glass-region edges (was visible as a
# faint line between e.g. Dolphin tabs and the file area)
plugin:hyprglass:chromatic_aberration = 0.0
plugin:hyprglass:lens_distortion = 0.1
plugin:hyprglass:edge_thickness = 0.2
# Layer-surface glass is OFF by default, so hyprglass only ever glassed app
# WINDOWS — quickshell layers (the bar, popups, the alt-tab pie) got nothing.
# Enable it and whitelist ONLY the alt-tab pie's namespace so the rest of the
# desktop's layers are untouched. The pie's semi-opaque disc triggers the glass;
# its near-transparent full-screen input catcher is below the mask and ignored.
plugin:hyprglass:layers:enabled = 1
# quickshell:pie = alt-tab pie; wofi = the Super+R launcher (its translucent
# window glasses to the wallpaper). Comma-separated.
plugin:hyprglass:layers:namespaces = quickshell:pie, wofi
# mask threshold: glass only pixels with alpha >= this. The pie's full-screen
# input catcher is alpha 0.01 (must stay clickable) — without a threshold above
# it, hyprglass glassed the WHOLE screen. 0.03 discards the catcher (0.01) but
# keeps the near-clear disc (0.05) so the glass is untinted. (namespace=value;
# the colon in the namespace is fine since pairs are split on '=').
plugin:hyprglass:layers:namespace_mask_thresholds = quickshell:pie=0.03, wofi=0.03

plugin:hyprglass:brightness = 1.0
plugin:hyprglass:contrast = 1.0
plugin:hyprglass:saturation = 1.0
plugin:hyprglass:vibrancy = 1.0
plugin:hyprglass:vibrancy_darkness = 1.0
plugin:hyprglass:adaptive_dim = 1.0
plugin:hyprglass:adaptive_boost = 0.0
plugin:hyprglass:dark:brightness = 1.0
plugin:hyprglass:dark:contrast = 1.0
plugin:hyprglass:dark:saturation = 1.0
plugin:hyprglass:dark:vibrancy = 1.0
plugin:hyprglass:dark:adaptive_dim = 0.08
plugin:hyprglass:light:brightness = 1.0
plugin:hyprglass:light:contrast = 1.0
plugin:hyprglass:light:saturation = 1.0
plugin:hyprglass:light:vibrancy = 1.0
plugin:hyprglass:light:adaptive_boost = 0.8

#############################

### ENVIRONMENT VARIABLES

#############################

env = XDG_SESSION_TYPE,wayland

###################

### PERMISSIONS

###################

#####################

### LOOK AND FEEL

#####################

general {
gaps_in = 4
gaps_out = 6
border_size = 2
col.active_border = rgba(ffffffcc)
# invisible — only the focused window shows a border (wallpaper-colored)
col.inactive_border = rgba(00000000)
resize_on_border = false
allow_tearing = false
layout = dwindle
}

render {
# Hand fullscreen apps straight to the display instead of routing every
# frame through the compositor. Off by default in Hyprland — without it a
# fullscreen game is always composited (+1 frame latency, pacing coupled
# to the compositor), which is why high fps still feels laggy.
direct_scanout = 1
}

decoration {
rounding = 10
rounding_power = 2
active_opacity = 1.0
inactive_opacity = 1.0
shadow {
enabled = true
range = 4
render_power = 3
color = rgba(1a1a1aee)
# unfocused windows: no shadow — its dark rim reads as a gray "border" on
# light wallpapers (focused keeps depth)
color_inactive = rgba(00000000)
}
blur {
enabled = false
# size/passes are NOT used for blurring here (enabled=false) — but Hyprland's
# render pass computes its damage-expansion radius for "live blur" regions as
# size * 2^passes, and hyprglass declares its windows as live-blur so the
# backdrop it SAMPLES (60px padding + ~40px refraction reach) gets re-rendered.
# At size=3 that radius was 6px -> stale-frame pixels got sampled at every
# partial repaint (focus/unfocus border animation!) = the stacked-glass
# glitter. 40 * 2^1 = 80px covers the real sampling reach.
size = 40
passes = 1
vibrancy = 0.1696
}
}

animations {
enabled = yes, please :)
bezier = easeOutQuint,   0.23, 1,    0.32, 1
bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
bezier = linear,         0,    0,    1,    1
bezier = almostLinear,   0.5,  0.5,  0.75, 1
bezier = quick,          0.15, 0,    0.1,  1
bezier = slideOut,       0.25, 1,  0.3,  1
animation = global,        1,     10,    default
animation = border,        1,     5.39,  easeOutQuint
animation = windows,       1,     4.79,  easeOutQuint
animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
animation = windowsOut,    1,     1.49,  linear,       popin 87%
animation = fadeIn,        1,     1.73,  almostLinear
animation = fadeOut,       1,     1.46,  almostLinear
animation = fade,          1,     3.03,  quick
animation = layers,        1,     3.81,  easeOutQuint
animation = layersIn,      1,     4,     easeOutQuint, fade
animation = layersOut,     1,     1.5,   linear,       fade
animation = fadeLayersIn,  1,     1.79,  almostLinear
animation = fadeLayersOut, 1,     1.39,  almostLinear
animation = workspaces,    1,     5.82,  slideOut, slide
animation = workspacesIn,  1,     3.63,  slideOut, slide
animation = workspacesOut, 1,     5.82,  slideOut, slide
animation = zoomFactor,    1,     7,     quick
}

dwindle {
preserve_split = true
}

master {
new_status = master
}

misc {
force_default_wallpaper = 0
disable_hyprland_logo = true
vrr = 2
# Apps that try to grab focus (e.g. browser link click → terminal popups)
# can't yank you out of what you're doing
focus_on_activate = false
}

cursor {
# Use hardware cursors. The "cursor lost over unfocused windows" issue was NOT
# a hardware-cursor problem — it was input:follow_mouse=0 tying pointer focus to
# keyboard focus (fixed via follow_mouse=2 in the input block). Forcing software
# cursors (no_hardware_cursors=true) didn't help AND spawned a phantom static
# cursor in the center of the screen at startup (a known software-cursor bug),
# so we keep hardware cursors here.
no_hardware_cursors = false
}

#############

### INPUT

#############

input {
kb_layout = us
# Click to focus only for the KEYBOARD — never on hover (no accidental typing
# into whatever window the cursor brushed past). follow_mouse=2 detaches
# pointer focus from keyboard focus: keyboard focus still changes only on
# click, but the window under the cursor always gets pointer focus so it sets
# the cursor image. (follow_mouse=0 tied the two together, so over an UNFOCUSED
# window no client owned the pointer and the cursor vanished — looked like it
# went "behind" the window.)
follow_mouse = 2
mouse_refocus = false
# Floating windows shouldn't steal focus when hovered either
float_switch_override_focus = 0
sensitivity = 0
force_no_accel = true
# Don't warp the pointer on focus changes. The Super+Space/V/C window actions
# focus the hovered window by address (window-action.sh) to act on it; with
# follow_mouse=2 a warp here would jerk the cursor.
no_warps = true
touchpad {
natural_scroll = false
}
}


gesture = 3, horizontal, workspace

###################

### KEYBINDINGS

###################

$mainMod = SUPER

bind = $mainMod, W, exec, ~/.config/hypr/wallpaper-cycle.sh next
bind = $mainMod, Q, exec, $terminal
# close-under-cursor (same raycast as minimize; falls back to active window)
bind = $mainMod, C, exec, ~/.config/hypr/window-action.sh close
bind = $mainMod, ESCAPE, exec, ~/.config/hypr/window-action.sh close
bind = $mainMod, M, exec, wlogout
# Blank the displays for "overnight" WITHOUT a DisplayPort disconnect. Use this
# instead of the monitors' physical power buttons — powering them off looks like
# a hotplug to Hyprland and segfaults its render path on power-on (a known
# AMD/Hyprland bug; see ~/.cache/hyprland/hyprlandCrashReport*). Any mouse/key
# wakes them back on.
bind = $mainMod SHIFT, O, dpms, off
bind = $mainMod, E, exec, $fileManager
# Maximize: fills the screen but stays FLOATING, so it stays on top like your
# other floating windows (tiling drops it below them and gets covered). Keeps
# the quickshell bar visible (fullscreen 1 respects reserved areas). Toggles
# back. Use for Shotcut/Unity/etc.
bind = $mainMod, V, exec, ~/.config/hypr/window-action.sh maximize
bind = $mainMod, R, exec, $menu
# Toggle tiling for the active window (you float by default, so this tiles it).
bind = $mainMod, SPACE, exec, ~/.config/hypr/window-action.sh float

# Screenshots
bind = $shiftMod, PRINT, exec, grim -g "$(slurp)" -t ppm - | satty --filename - --output-filename ~/Pictures/Screenshots/$(date '+%Y%m%d-%H%M%S').png --copy-command wl-copy
bind = $mainMod, PRINT, exec, grim - | satty --filename - --fullscreen --output-filename ~/Pictures/Screenshots/$(date '+%Y%m%d-%H%M%S').png --copy-command wl-copy

# Move focus

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = ALT, Tab, global, quickshell:alttab
bindr = ALT, Tab, exec, hyprctl dispatch global "quickshell:alttabrelease"

# Super + scroll-up brings up the alt-tab pie. (mouse_down keyword = physical
# scroll-up on this hardware.) Releasing Super activates the hovered window;
# Escape or clicking outside dismisses without activating.
bind = $mainMod, mouse_down, global, quickshell:alttab
bindr = , SUPER_L, exec, hyprctl dispatch global "quickshell:alttabrelease"

# macOS-style minimize: SUPER+scroll stashes the hovered window on the
# special:minimized workspace. Debounced inside minimize.sh.
# (mouse_up here = physical scroll-down on this hardware)
bind = $mainMod, mouse_up, exec, ~/.config/hypr/minimize.sh

# ==========================================================

# WORKSPACE NAVIGATION

# ==========================================================

bind = $mainMod, bracketleft, exec, ~/.config/hypr/workspace-move.sh left
bind = $mainMod, bracketright, exec, ~/.config/hypr/workspace-move.sh right
bind = $mainMod SHIFT, bracketleft, exec, ~/.config/hypr/workspace-move.sh left --move
bind = $mainMod SHIFT, bracketright, exec, ~/.config/hypr/workspace-move.sh right --move

# Mouse binds

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys

bindel = ,XF86AudioRaiseVolume, exec, ~/.config/hypr/volume.sh up
bindel = ,XF86AudioLowerVolume, exec, ~/.config/hypr/volume.sh down
bindel = ,XF86AudioMute, exec, ~/.config/hypr/volume.sh mute
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# ==========================================================

# AI BACKGROUND TASK KILL-SWITCH

# ==========================================================

bind = CTRL ALT $mainMod, A, exec, tmux kill-server

# ── Keybind rebinding (Settings → Hotkeys) ──
# __tc_capture is an empty submap: while it is active no global binds fire, so
# the Settings app can read ANY pressed combo (even normally-bound ones) to set
# a new shortcut. Escape leaves the submap (restoring binds) and tells the app
# to cancel — a safety hatch in case capture is ever left open.
submap = __tc_capture
bind = , escape, exec, hyprctl keyword submap reset; qs ipc call settings rebindcancel
submap = reset

# User rebinds written by Settings -> Hotkeys (unbind original + bind new).
# Sourced LAST so they win over the defaults above; gitignored so updates never
# revert them. Created from keybinds.conf.example on install.
source = ~/.config/hypr/keybinds.conf

##############################

### WINDOWS AND WORKSPACES

##############################

windowrule = suppress_event maximize, match:class .*

# Float everything by default — no tiling
windowrule = float on, match:class .*
# Per-app floating geometry (monitor + size + position) remembered ACROSS
# REBOOTS by ~/.config/hypr/window-geometry.py, which writes the rules into the
# file sourced below. Sourced here so windows SPAWN at their remembered spot.
# (Re-enabled — confirmed not the crash cause.)
source = ~/.config/hypr/window-geometry.conf

windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0
windowrule = float on, match:class ^(hyprland-run)$
windowrule = move 20 100%-120, match:class ^(hyprland-run)$

# SPOTIFY — per-pixel transparent background via Hypr-DarkWindow chromakey:
# the theme paints the background the KEY color and this shader rule keys
# exactly that color to transparent — background shows what's really behind
# the window; colored blocks/text/album art stay solid.
# NOTE: the X11 class is 'Spotify' CAPITALIZED (cost a whole night of debugging).
# KEY = mid-tone mauve #7A6E85 [0.478 0.431 0.522] (matches the theme CSS bg).
# Custom EDGE-AWARE keyer (technicolor-chromakey.glsl): key pixels go fully
# transparent, and the anti-aliased key<->block blend pixels at rounded corners
# get UN-MIXED into true partial transparency (kills the dark/smudge arcs).
# Interior content protected by a keyed-neighbor test.
# custom edge-aware keyer (technicolor-chromakey.glsl): un-mixes the AA blend
# at block corners into true partial transparency. Flat category form —
# the nested shader[id]{} form from the README failed to bind in hyprlang 0.55.
# The shader registrations + windowrules live in local.conf (the plugin needs
# ABSOLUTE shader paths — no ~ expansion). See local.conf.example for the
# ready-to-uncomment blocks:
#   * Spotify  — self-calibrating keyer (whole-window; bg painted the key).
#   * Dolphin  — fixed-key variant; the fixed key matters because the class
#     rule also hits Dolphin's dialogs, whose corner pixel would otherwise be
#     sampled as the key and key whole dialogs transparent.
#   * Brave    — BAND-LIMITED keyer: only the top tab-strip band is keyable, so
#     the frame glasses to the wallpaper while web content below is NEVER
#     touched (whole-window browser keying ate matching pixels in pages, e.g.
#     Twitch streams — the band gate is what makes it safe).
# (Telegram is NOT keyed — no empty chrome zone; its only large empty area is
# its own chat-wallpaper region, so keying dumps the desktop wallpaper over
# content.)

# GPU SCREEN RECORDER UI

windowrule = float on, match:class ^(com.dec05eba.gpu_screen_recorder)$
windowrule = no_anim on, match:class ^(com.dec05eba.gpu_screen_recorder)$
windowrule = no_blur on, match:class ^(com.dec05eba.gpu_screen_recorder)$
windowrule = no_shadow on, match:class ^(com.dec05eba.gpu_screen_recorder)$
windowrule = border_size 0, match:class ^(com.dec05eba.gpu_screen_recorder)$
windowrule = size 100% 100%, match:class ^(com.dec05eba.gpu_screen_recorder)$
windowrule = center on, match:class ^(com.dec05eba.gpu_screen_recorder)$

windowrule = float on, match:class ^(gsr-ui)$
windowrule = no_anim on, match:class ^(gsr-ui)$
windowrule = no_blur on, match:class ^(gsr-ui)$
windowrule = no_shadow on, match:class ^(gsr-ui)$
windowrule = border_size 0, match:class ^(gsr-ui)$
windowrule = size 100% 100%, match:class ^(gsr-ui)$
windowrule = center on, match:class ^(gsr-ui)$

source = ~/.config/hypr/monitors.conf
# Focused-window border color = wallpaper's primary accent, written by
# wallpaper-colors.py on each wallpaper change. Sourced AFTER the general block
# above so it overrides col.active_border there.
source = ~/.config/hypr/colors.conf
# hyprglass slider overrides (Settings → Glass). Sourced AFTER the plugin's
# defaults above so the user's tuned values win; absent/empty = defaults.
source = ~/.config/hypr/hyprglass-tuning.conf

env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,Breeze

# LibreOffice on the KF6 VCL plugin (NOT gtk3). gtk3 caches its colors at
# launch and never live-recolors on a wallpaper change; kf6 is a real KF6 app
# that reads kdeglobals and follows the KGlobalSettings.notifyChange signal
# gen-kde-colors.py fires — the same live-recolor path Dolphin uses. Only LO
# reads SAL_USE_VCLPLUGIN, so this is safely scoped. Revert: delete this line.
# (Also mirrored in ~/.config/environment.d/ — see technicolor.conf.example —
# so D-Bus/systemd-launched LibreOffice picks it up too.)
env = SAL_USE_VCLPLUGIN,kf6

# Cursor theme/size set HERE (Hyprland-owned) instead of relying on KDE's
# kcminputrc / nwg-look. Same shape you picked — Bibata-Modern-Ice — just no
# longer dependent on Plasma settings. (XCursor; Hyprland uses it directly.)
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

# Machine-specific / personal settings — git-ignored, kept off the public repo.
source = ~/.config/hypr/local.conf


